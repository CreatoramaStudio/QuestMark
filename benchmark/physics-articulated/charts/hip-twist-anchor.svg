<text x="24" y="461" font-size="11.5" class="m">80 files (4 sizes x leg/arm x 5 cases x 2 rates), 4 joint variants, 2 runs each: 32 runs per case and variant, 160 per variant</text>
<text x="24" y="477" font-size="11.5" class="m">over the 5 cases (above 0.1 m in all cases: Jolt swing-twist 10, Jolt six-DOF 10, PhysX articulation 0, PhysX D6 54).</text>
<text x="24" y="493" font-size="11.5" class="m">Counts do not depend on machine load (all timings of this family are invalid and unused). The libraries do not enforce the same</text>
