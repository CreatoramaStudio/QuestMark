<svg xmlns="http://www.w3.org/2000/svg" width="860" height="551" viewBox="0 0 860 551" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">3-DOF ball joint: runs with anchor error above 0.1 m</title><desc id="d">Grouped bars: runs of 32 per case with anchor error above 0.1 m for four joint variants over five cases. Totals over the five cases: Jolt swing-twist 10, Jolt six-DOF 10, PhysX articulation 0, PhysX D6 54. Lower is better (fewer runs with anchor error above 0.1 m). Green = the lowest count of each case, ties all green (no percent of best: the best is often 0). Best result in each comparison group drawn green.</desc>
<style>.t{fill:#1f2328}.m{fill:#57606a}.ax{stroke:#8c959f}.g{stroke:#d0d7de}.f{stroke:#57606a;stroke-dasharray:4 3}.ring{fill:none;stroke:#1f2328;stroke-width:2}.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.best{fill:#1a7f37}@media (prefers-color-scheme:dark){.t{fill:#e6edf3}.m{fill:#9198a1}.ax{stroke:#6e7681}.g{stroke:#30363d}.f{stroke:#9198a1}.ring{stroke:#e6edf3}.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.best{fill:#3fb950}}</style>
