<svg xmlns="http://www.w3.org/2000/svg" width="860" height="791" viewBox="0 0 860 791" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Idle-machine physics step time of the small articulated scenes</title><desc id="d">Bar charts of idle-machine step time: chain matrix median and p99 for 12 cases, and a summary over 96 limb files. Largest chain-matrix p99: Jolt 0.0833 ms, PhysX 0.261 ms. Lower is better (step time in ms: lower is faster). Green = the faster bar of each row; the percentage is best / value, so the best is 100%. Best result in each comparison group drawn green.</desc>
<style>.t{fill:#1f2328}.m{fill:#57606a}.ax{stroke:#8c959f}.g{stroke:#d0d7de}.f{stroke:#57606a;stroke-dasharray:4 3}.ring{fill:none;stroke:#1f2328;stroke-width:2}.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.best{fill:#1a7f37}@media (prefers-color-scheme:dark){.t{fill:#e6edf3}.m{fill:#9198a1}.ax{stroke:#6e7681}.g{stroke:#30363d}.f{stroke:#9198a1}.ring{stroke:#e6edf3}.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.best{fill:#3fb950}}</style>
