<text x="24" y="651" font-size="11.5" class="m">Idle-machine files only (timing_note &#x27;idle machine, other applications closed, 1 session&#x27;): 12 chain-matrix cases (run 1 per</text>
<text x="24" y="667" font-size="11.5" class="m">backend) and 96 limb files (run 1 per backend, 1 thread unless the label says 4).</text>
<text x="24" y="683" font-size="11.5" class="m">Physics update call only, after warm-up; one machine, one session, desktop CPU class, no other hardware. Step times of the other</text>
<text x="24" y="699" font-size="11.5" class="m">families were measured on a busy machine and are not shown.</text>
<text x="24" y="715" font-size="11.5" class="m">Small scenes (13 bodies); this is not a performance ranking of the libraries. One skeleton, boxes only, float32, CPU, one</text>
<text x="24" y="731" font-size="11.5" class="m">machine; Jolt 5.7.0 tag v5.7.0; PhysX 5.13.0 built from a branch head, not a tag.</text>
