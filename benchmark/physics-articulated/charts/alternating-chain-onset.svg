<text x="24" y="484" font-size="11.5" class="m">Alternating 50 t / 50 kg chain, 12 links, hinge axis parallel to gravity, tip speed 0.1 m/s, CCD on, 1 thread, 1 run per case, 2</text>
<text x="24" y="500" font-size="11.5" class="m">episodes of 2 s; onset steps are in episode 1. Jolt went non-finite in 10 of 16 Jolt cases.</text>
<text x="24" y="516" font-size="11.5" class="m">Onset steps do not depend on machine load (these runs were made while the machine was busy; no timing is used). Ring = first</text>
<text x="24" y="532" font-size="11.5" class="m">step with anchor error above 1 m.</text>
<text x="24" y="548" font-size="11.5" class="m">A missing bar means no non-finite state in the run; PhysX maximal lost closure (ring) without a non-finite state. One skeleton,</text>
<text x="24" y="564" font-size="11.5" class="m">boxes only, float32, CPU, one machine; Jolt 5.7.0 tag v5.7.0; PhysX 5.13.0 built from a branch head, not a tag.</text>
</svg>
