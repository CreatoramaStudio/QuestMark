<svg xmlns="http://www.w3.org/2000/svg" width="860" height="590" viewBox="0 0 860 590" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Alternating-mass chain: step of the first non-finite state</title><desc id="d">Onset charts for 13 configurations at 120 and 200 Hz. Jolt reaches a non-finite state in 10 of 16 cases, between step 157 and step 268 of the episode; PhysX articulation reaches none. Higher (later) is better: a later non-finite step is better, and no non-finite state at all (never) is best. Green = best in each Hz panel (every case with never, else the latest step). Best result in each comparison group drawn green.</desc>
<style>.t{fill:#1f2328}.m{fill:#57606a}.ax{stroke:#8c959f}.g{stroke:#d0d7de}.f{stroke:#57606a;stroke-dasharray:4 3}.ring{fill:none;stroke:#1f2328;stroke-width:2}.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.best{fill:#1a7f37}@media (prefers-color-scheme:dark){.t{fill:#e6edf3}.m{fill:#9198a1}.ax{stroke:#6e7681}.g{stroke:#30363d}.f{stroke:#9198a1}.ring{stroke:#e6edf3}.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.best{fill:#3fb950}}</style>
