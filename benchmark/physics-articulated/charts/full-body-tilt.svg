<text x="24" y="497" font-size="11.5" class="m">Worst of the 4 body sizes per bar; run 1 of 2; 48 files. The scripted step has no balance controller, so the PhysX torso tilts</text>
<text x="24" y="513" font-size="11.5" class="m">0.45 to 0.46 rad in the three step scenes (open-loop script).</text>
<text x="24" y="529" font-size="11.5" class="m">Tilt is pose-based and independent of machine load. One skeleton, boxes only, float32, CPU, one machine; Jolt 5.7.0 tag v5.7.0;</text>
<text x="24" y="545" font-size="11.5" class="m">PhysX 5.13.0 built from a branch head, not a tag.</text>
