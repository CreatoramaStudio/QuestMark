<text x="24" y="647" font-size="11.5" class="m">80 limb files (leg and arm, 4 body sizes, 2 step rates, cases hold, swing, wall, impact, worst-axis hold; short-ton h85m files</text>
<text x="24" y="663" font-size="11.5" class="m">left out), 2 runs each; each bar is the worst over 5 cases and 2 runs.</text>
<text x="24" y="679" font-size="11.5" class="m">Anchor error is a pose-based metric, independent of machine load. Thresholds (0.01 m, 0.1 m, 0.1 rad) are harness choices, not</text>
<text x="24" y="695" font-size="11.5" class="m">standards.</text>
<text x="24" y="711" font-size="11.5" class="m">One skeleton, boxes only, float32, CPU, one machine; Jolt 5.7.0 tag v5.7.0; PhysX 5.13.0 built from a branch head, not a tag.</text>
