</g>
<text x="24" y="611" font-size="11.5" class="m">A case passes when no run of it has a non-finite state, anchor error above 0.1 m or axis error above 0.1 rad (the README flag levels);</text>
<text x="24" y="627" font-size="11.5" class="m">each family uses its own scenes, so rows are not comparable with each other.</text>
<text x="24" y="643" font-size="11.5" class="m">Case = one result file and backend (worst of its runs); the hip-twist rows and the full-body Jolt remedy rows cover only the cases they</text>
<text x="24" y="659" font-size="11.5" class="m">ran; chain rows include the alternating-mass chain.</text>
<text x="24" y="675" font-size="11.5" class="m">Tunnelling, determinism and limit-excess checks are not part of this pass rule. No machine-load dependence. Thresholds (0.01 m, 0.1 m,</text>
<text x="24" y="691" font-size="11.5" class="m">0.1 rad) are harness choices, not standards.</text>
<text x="24" y="707" font-size="11.5" class="m">One skeleton, boxes only, float32, CPU, one machine; Jolt 5.7.0 tag v5.7.0; PhysX 5.13.0 built from a branch head, not a tag.</text>
</svg>
