<svg xmlns="http://www.w3.org/2000/svg" width="900" height="733" viewBox="0 0 900 733" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Share of cases within the harness flag levels, per test family and setting</title><desc id="d">Horizontal bars of the share of cases that stay within the flag levels for each family, backend and solver setting. Higher is better (share of cases within the flag levels). Green = highest share in its comparison group; rows that run alone stay blue. Best result in each comparison group drawn green.</desc>
<style>.t{fill:#1f2328}.m{fill:#57606a}.ax{stroke:#8c959f}.g{stroke:#d0d7de}.f{stroke:#57606a;stroke-dasharray:4 3}.ring{fill:none;stroke:#1f2328;stroke-width:2}.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.best{fill:#1a7f37}@media (prefers-color-scheme:dark){.t{fill:#e6edf3}.m{fill:#9198a1}.ax{stroke:#6e7681}.g{stroke:#30363d}.f{stroke:#9198a1}.ring{stroke:#e6edf3}.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.best{fill:#3fb950}}</style>
