<svg xmlns="http://www.w3.org/2000/svg" width="860" height="784" viewBox="0 0 860 784" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
<title id="t">Standing on a ground box: stance and flag counts per backend and solver setting</title><desc id="d">Three bar panels. Jolt with default iterations stays upright in 12 of 40 cases and with 100/30 iterations in 40 of 40; PhysX articulation in 40 of 40 in both settings. Direction differs by panel: upright counts (first and third panel) higher is better; flag-fires count (second panel) lower is better. Green = best bar of its panel (ties all green). Best result in each comparison group drawn green.</desc>
<style>.t{fill:#1f2328}.m{fill:#57606a}.ax{stroke:#8c959f}.g{stroke:#d0d7de}.f{stroke:#57606a;stroke-dasharray:4 3}.ring{fill:none;stroke:#1f2328;stroke-width:2}.s1{fill:#2a78d6}.s2{fill:#eb6834}.s3{fill:#1baf7a}.best{fill:#1a7f37}@media (prefers-color-scheme:dark){.t{fill:#e6edf3}.m{fill:#9198a1}.ax{stroke:#6e7681}.g{stroke:#30363d}.f{stroke:#9198a1}.ring{stroke:#e6edf3}.s1{fill:#3987e5}.s2{fill:#d95926}.s3{fill:#199e70}.best{fill:#3fb950}}</style>
