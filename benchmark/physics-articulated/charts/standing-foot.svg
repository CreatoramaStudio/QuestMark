<text x="24" y="694" font-size="11.5" class="m">240 backend cases (4 sizes x 2 rates x 5 scenes x 3 backends x 2 solver settings), 2 runs each; a case counts by its worst run.</text>
<text x="24" y="710" font-size="11.5" class="m">&#x27;Stays upright&#x27; = tilt &lt;= 0.1 rad, end sag &lt; 10 % of pelvis height, last step reached.</text>
<text x="24" y="726" font-size="11.5" class="m">Counts do not depend on machine load (timings of this family are invalid and unused). The 2 t impact is a very small disturbance</text>
<text x="24" y="742" font-size="11.5" class="m">for these pelvis masses. Thresholds (0.01 m, 0.1 m, 0.1 rad) are harness choices, not standards.</text>
<text x="24" y="758" font-size="11.5" class="m">One skeleton, boxes only, float32, CPU, one machine; Jolt 5.7.0 tag v5.7.0; PhysX 5.13.0 built from a branch head, not a tag.</text>
